# Production on the shared VPS: no ports on the host — the shared Caddy
# (/opt/caddy-shared/Caddyfile) proxies cal.borozdov.ru to cal-app:4000.
services:
  app:
    container_name: cal-app
    build: .
    environment:
      DATABASE_URL: postgresql://cal:${POSTGRES_PASSWORD}@db:5432/cal
      TZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks: [default, shared-caddy]

  db:
    container_name: cal-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cal
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cal -d cal']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    networks: [default]

networks:
  shared-caddy:
    name: short-link_default
    external: true
